name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pythonfmu3_version:
        description: "PythonFMU3 version to bundle (empty = latest on PyPI)"
        required: false
        default: ""
  schedule:
    - cron: "17 4 * * 1"      # weekly: pick up new PythonFMU3 releases

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bundle the PythonFMU3 wheel
        run: |
          VERSION="${{ github.event.inputs.pythonfmu3_version || vars.PYTHONFMU3_VERSION }}"
          if [ -n "$VERSION" ]; then
            python scripts/fetch_wheel.py --version "$VERSION"
          else
            python scripts/fetch_wheel.py
          fi

      - name: Check the Python bridge compiles
        run: python -m py_compile py/bridge.py

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html app.js app.css worker.js logo.svg _site/
          cp -r py wheels _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
